# SPDX-License-Identifier: Apache-2.0
# Builds the website builder image. Pull requests build it; pushes to main and
# release tags also publish it to ghcr.io.
name: image
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: ghcr.io/fpsot-org/fpsot-website-builder
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: podman build --pull=missing -f Containerfile -t "$IMAGE:build" .
      - name: Publish the image
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          tags=("sha-${GITHUB_SHA::12}")
          if [ "$REF_TYPE" = tag ]; then tags+=("$REF_NAME"); else tags+=(latest); fi
          for t in "${tags[@]}"; do
            podman tag "$IMAGE:build" "$IMAGE:$t"
            podman push "$IMAGE:$t"
          done
